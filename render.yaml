# Blueprint de Render: API + base de datos PostgreSQL
databases:
  - name: lomito-db
    plan: basic-256mb
    databaseName: lomito
    user: lomito

services:
  - type: web
    name: lomito-atelier-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w api && npm run migrate -w api
    startCommand: npm start -w api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: lomito-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://lomitoatelier.mx,https://www.lomitoatelier.mx,https://lomito-atelier.vercel.app
      - key: PUBLIC_WEB_URL
        value: https://www.lomitoatelier.mx
      # WhatsApp Business (Meta Cloud API). Se llenan en Render → Environment.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_REMINDER
        sync: false
      - key: WHATSAPP_TEMPLATE_CONFIRM
        sync: false

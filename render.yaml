# Blueprint de Render: API + base de datos PostgreSQL
databases:
  - name: lomito-db
    plan: basic-256mb
    databaseName: lomito
    user: lomito

services:
  - type: web
    name: lomito-atelier-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w api && npm run migrate -w api
    startCommand: npm start -w api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: lomito-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://lomitoatelier.mx,https://www.lomitoatelier.mx,https://lomito-atelier.vercel.app
